<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>Our Service's</title>
<!-- Add Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<section>

		<!-- Page Header -->
		<div class="container-fluid bg-secondary py-5">
			<div class="container py-5">
				<div class="row align-items-center py-4">
					<div class="col-md-6 text-center text-md-left">
						<h1 class="mb-4 mb-md-0 text-primary text-uppercase">Our Service's</h1>
					</div>
					<div class="col-md-6 text-center text-md-right">
						<div class="d-inline-flex align-items-center">
							<a class="btn btn-outline-primary" href="/">Home</a> 
							<i class="fas fa-angle-double-right text-primary mx-2"></i> 
							<a class="btn btn-outline-primary disabled" href="">Service's</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Categories Sidebar -->
		<div class="container">
			<div class="row">
				<!-- Sidebar for Categories -->
				<div class="col-md-3">
					<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<h5 class="fs-4 text-primary">Categories</h5>
							<div class="list-group">
								<a href="/products" class="list-group-item list-group-item-action text-dark fw-bold">
									<i class="fa-solid fa-box-open me-2"></i> All Service's
								</a>
								<a th:each="c:${categories}"
								   th:href="@{'/products?category='+${c.name}}"
								   class="list-group-item list-group-item-action text-dark fw-bold">
									<i class="fa-solid fa-tag me-2"></i> [[${c.name}]]
								</a>
							</div>
						</div>
					</div>
				</div>

				<!-- Products Section -->
				<div class="col-md-9">
					<div class="container-fluid bg-light pt-5">
						<div class="container py-5">
							<div class="row justify-content-center mb-4">
								<div class="col-lg-6 col-md-8 col text-center">
									<h6 class="text-primary font-weight-normal text-uppercase mb-3">Our Service's</h6>
									<h1 class="mb-4">Explore Our Latest Service's</h1>
								</div>
							</div>
							<div class="row">
								<!-- Product Cards -->
								<div class="col-md-4" th:each="p:${products}">
									<div class="card shadow-sm mb-4">
										<!-- Image with Fixed Height -->
										<div class="card-img-top" style="height: 200px; overflow: hidden;">
											<img th:src="@{'/img/product_img/'+${p.image}}" class="img-fluid w-100" alt="Product Image" style="object-fit: cover; height: 100%;">
										</div>
										<div class="card-body">
											<h5 class="card-title text-truncate">[[${p.title}]]</h5>
											<p class="card-text">
												<span class="text-primary">&#8377; [[${p.discountPrice}]]</span> 
												<span class="text-secondary text-decoration-line-through">&#8377; [[${p.price}]]</span>
												<span class="text-success">[[${p.discount}]]% off</span>
											</p>
											<a th:href="@{'/product/'+${p.id}}" class="btn btn-primary btn-sm">View Details</a>
										</div>
									</div>
								</div>

								<th:block th:unless="${productsSize > 0}">
									<p class="text-center fs-4 text-danger">No products available</p>
								</th:block>
							</div>

							<!-- Pagination -->
							<div class="row">
								<div class="col-md-12">
									<th:block th:if="${productsSize > 0}">
										<nav aria-label="Page navigation">
											<ul class="pagination justify-content-center">
												<li class="page-item" th:classappend="${isFirst} ? 'disabled':''">
													<a class="page-link" th:href="@{'/products?pageNo='+(${pageNo-1})}" aria-label="Previous"> 
														<span aria-hidden="true">&laquo;</span>
													</a>
												</li>
												<li th:each="i:${#numbers.sequence(1,totalPages)}" class="page-item"
													th:classappend="${pageNo+1 == i} ? 'active':''">
													<a class="page-link" th:href="@{'/products?pageNo='+(${i-1})}">[[${i}]]</a>
												</li>
												<li class="page-item" th:classappend="${isLast} ? 'disabled':''">
													<a class="page-link" th:href="@{'/products?pageNo='+(${pageNo+1})}" aria-label="Next"> 
														<span aria-hidden="true">&raquo;</span>
													</a>
												</li>
											</ul>
										</nav>
									</th:block>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>

	</section>

	<!-- Add Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
