<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="ISO-8859-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management</title>
    <!-- Add your CSS links here -->
</head>
<body>
    <section>
        <div class="container-fluid mt-5 p-5 bg-light">
            <!-- Profile Section -->
            <div class="row">
                <div class="col-md-10 offset-md-1">
                    <h2 class="fs-3 text-center">My Profile</h2>
                    
                    <!-- Success and Error Messages -->
                    <th:block th:if="${session.succMsg}">
                        <p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                        <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                    </th:block>
                    
                    <th:block th:if="${session.errorMsg}">
                        <p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
                        <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                    </th:block>
                    
                    <hr>
                    
                    <!-- Profile Image -->
                    <div class="text-center">
                        <img alt="Profile Image" th:src="@{'../img/profile_img/' + ${user.profileImage}}"
                            class="border p-2 rounded-circle"
                            style="width: 110px; height: 110px;">
                    </div>
                    
                    <!-- Profile Details Form -->
                    <div class="col-md-8 offset-md-2 mt-4">
                        <form action="/user/update-profile" method="post" enctype="multipart/form-data">
                            <table class="table table-borderless">
                                <tbody>
                                    <tr>
                                        <th>Name</th>
                                        <td><input type="text" name="name" class="form-control" th:value="${user.name}"></td>
                                    </tr>
                                    <tr>
                                        <th>Mobile Number</th>
                                        <td><input type="text" name="mobileNumber" class="form-control" th:value="${user.mobileNumber}"></td>
                                    </tr>
                                    <tr>
                                        <th>Email</th>
                                        <td><input type="text" class="form-control" readonly th:value="${user.email}"></td>
                                    </tr>
                                    <tr>
                                        <th>Address</th>
                                        <td><input type="text" name="address" class="form-control" th:value="${user.address}"></td>
                                    </tr>
                                    <tr>
                                        <th>City</th>
                                        <td><input type="text" name="city" class="form-control" th:value="${user.city}"></td>
                                    </tr>
                                    <tr>
                                        <th>State</th>
                                        <td><input type="text" name="state" class="form-control" th:value="${user.state}"></td>
                                    </tr>
                                    <tr>
                                        <th>Pincode</th>
                                        <td><input type="text" name="pincode" class="form-control" th:value="${user.pincode}"></td>
                                    </tr>
                                    <tr>
                                        <th>Image</th>
                                        <td><input type="file" name="img" class="form-control"></td>
                                    </tr>
                                    <tr>
                                        <th>Role</th>
                                        <td><input type="text" class="form-control" readonly th:value="${user.role}"></td>
                                    </tr>
                                    <tr>
                                        <th>Account Status</th>
                                        <td>
                                            <input type="text" class="form-control" readonly th:value="${user.isEnable}">
                                            <input type="hidden" name="id" th:value="${user.id}">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" class="text-center">
                                            <button type="submit" class="btn btn-primary">Update</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </form>
                    </div>
                </div>
            </div>
            
            <hr>
            
            <!-- Change Password Section -->
            <div class="row mt-4">
                <div class="col-md-10 offset-md-1">
                    <h2 class="text-center fs-3">Change Password</h2>
                    <div class="col-md-6 offset-md-3">
                        <form action="/user/change-password" method="post">
                            <table class="table table-borderless">
                                <tbody>
                                    <tr>
                                        <th>Current Password</th>
                                        <td><input type="password" name="currentPassword" class="form-control"></td>
                                    </tr>
                                    <tr>
                                        <th>New Password</th>
                                        <td><input type="password" name="newPassword" class="form-control"></td>
                                    </tr>
                                    <tr>
                                        <th>Confirm Password</th>
                                        <td><input type="password" name="confirmPassword" class="form-control"></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" class="text-center">
                                            <button type="submit" class="btn btn-primary">Update</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
