<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">

<body>
    <section>
        <!-- Page Header Start -->
        <div class="container-fluid bg-secondary py-5">
            <div class="container py-5">
                <div class="row align-items-center py-4">
                    <div class="col-md-6 text-center text-md-left">
                        <h1 class="mb-4 mb-md-0 text-primary text-uppercase">Our Projects</h1>
                    </div>
                    <div class="col-md-6 text-center text-md-right">
                        <div class="d-inline-flex align-items-center">
                            <a class="btn btn-outline-primary" href="/">Home</a>
                            <i class="fas fa-angle-double-right text-primary mx-2"></i>
                            <a class="btn btn-outline-primary disabled" href="">Our Projects</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Page Header End -->

        <!-- Projects Section Start -->
        <div class="container-fluid py-5">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8 col text-center mb-4">
                        <h6 class="text-primary font-weight-normal text-uppercase mb-3">Our Projects</h6>
                        <h1 class="mb-4">Some Of Our Awesome Interior Designing Projects</h1>
                    </div>
                </div>

                <!-- Portfolio Filters -->
                <div class="row">
                    <div class="col-12 text-center mb-2">
                        <ul class="list-inline mb-4" id="portfolio-flters">
                            <li class="btn btn-outline-primary m-1 active" data-filter="*">All</li>
                            
                        </ul>
                    </div>
                </div>

                <!-- Portfolio Items -->
                <div class="row mx-1 portfolio-container">
                    <div class="col-lg-4 col-md-6 col-sm-12 p-0 portfolio-item first" th:each="p:${projects}">
                        <div class="position-relative overflow-hidden">
                            <div class="portfolio-img d-flex align-items-center justify-content-center">
                                <!-- Image with Fixed Height -->
                                <img th:src="@{'/img/project_img/'+${p.image}}" class="img-fluid" alt="Project Image"
                                    style="object-fit: cover; height: 300px; width: 100%;">
                            </div>
                            <div class="portfolio-text bg-secondary d-flex flex-column align-items-center justify-content-center">
                                <!-- Project Title -->
                                <h4 class="text-white mb-4 text-truncate">[[${p.title}]]</h4>
                                <!-- Project Price and Discount -->
                                <p class="text-center text-white mb-3">
                                    <span class="text-primary">&#8377; [[${p.discountPrice}]]</span>
                                    <span class="text-secondary text-decoration-line-through">&#8377; [[${p.price}]]</span>
                                    <span class="text-success">[[${p.discount}]]% off</span>
                                </p>
                                <div class="d-flex align-items-center justify-content-center">
                                    <!-- View Details Button -->
                                    <a th:href="@{'/project/'+${p.id}}" class="btn btn-outline-primary m-1">View Details</a>
                                    <!-- View Image in Lightbox -->
                                    <a class="btn btn-outline-primary m-1" th:href="@{'/img/project_img/'+${p.image}}"
                                        data-lightbox="portfolio">
                                        <i class="fa fa-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <<!-- th:block th:unless="${projectsSize > 0}">
                        <p class="text-center fs-4 text-danger">No projects available</p>
                    </th:block> -->
                </div>
            </div>
        </div>
        <!-- Projects Section End -->
    </section>
</body>
</html>
