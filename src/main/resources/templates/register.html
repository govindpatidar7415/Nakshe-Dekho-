<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">

<head>
    <section>
        <style>
            body {
                background: #f8f9fa;
            }
            .registration-container {
                background: #ffffff;
                padding: 40px;
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
                border-radius: 10px;
            }
            .form-control {
                border-radius: 0px;
                padding: 20px;
                font-size: 16px;
            }
            .btn-primary {
                border-radius: 0px;
                padding: 8px 16px;
            }
            .form-group label {
                font-weight: bold;
            }
            .social-login a {
                font-size: 18px;
                width: 45px;
                height: 45px;
                background: #f8f9fa;
                display: inline-block;
                line-height: 45px;
                border-radius: 50%;
                margin: 0 10px;
            }
            .social-login a:hover {
                background-color: #007bff;
                color: #fff;
            }
            .registration-container h3 {
                font-weight: bold;
            }
            .registration-links {
                display: flex;
                justify-content: space-between;
                font-size: 14px;
            }
            .registration-links a {
                color: #007bff;
                text-decoration: none;
            }
            .registration-links a:hover {
                text-decoration: underline;
            }
        </style>
</head>

<body>
    <!-- Registration Form Start -->
    <div class="container-fluid bg-light py-5">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-5 registration-container">
                    <h3 class="text-center mb-4">Create Your Account</h3>
                    <div class="card-header text-center">
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
						</div>
                    <form action="/saveUser" enctype="multipart/form-data" id="userRegister" novalidate method="post">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" class="form-control" name="name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="mobileNumber">Mobile Number</label>
                            <input type="number" id="mobileNumber" class="form-control" name="mobileNumber" placeholder="Enter your mobile number" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" class="form-control" name="address" placeholder="Enter your address" required>
                        </div>
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" class="form-control" name="city" placeholder="Enter your city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" class="form-control" name="state" placeholder="Enter your state" required>
                        </div>
                        <div class="form-group">
                            <label for="pincode">Pincode</label>
                            <input type="number" id="pincode" class="form-control" name="pincode" placeholder="Enter your pincode" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" class="form-control" name="password" placeholder="Enter your password" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmpassword">Confirm Password</label>
                            <input type="password" id="confirmpassword" class="form-control" name="confirmpassword" placeholder="Confirm your password" required>
                        </div>
                        <div class="form-group">
                            <label for="img">Profile Image</label>
                            <input type="file" id="img" class="form-control" name="img">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Register</button>
                    </form>
                    <div class="registration-links text-center mt-3">
                        <a href="/login">Already have an account? Login</a>
                    </div>
                    <div class="social-login text-center mt-4">
                        <h5>Or register with</h5>
                        <a href="#"><i class="fab fa-google"></i></a>
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Registration Form End -->

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    </section>
</body>

</html>
